[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = [
  "DRAM: memory@80000000 with reg = <0 0x80000000 0x2 0x0> (8 GiB). Source: dts/instantnoodlep.dts:8-12; board.toml payload.dram_size = 0x200000000.",
  "Firmware map: the first 6 MiB are unavailable to UniXNU; DXE heap 0x98900000/0x3300000, Display Reserved 0x9C000000/0x2400000, UEFI FD 0x9FC00000/0x300000, Kernel 0xA0000000/0x100000000 and ramoops 0xB0000000/0x400000. Source: vendor uefiplat.cfg and MemoryMapLib.c.",
  "Loader handoff: payload.adt.owned_memory_size = 0x100000000 (4 GiB) in board.toml:80; the ADT memory map must stay inside the firmware map.",
  "UFS DMA: the kona ufshc node has no iommus property, so the controller uses physical addresses; the driver allocates 16 KiB physically contiguous cacheable memory and performs explicit dc civac/ivac. Source: sm8250.dtsi:56-66, NativeUfs.cpp:222-224, 1712-1744, 462-486.",
  "SMMU: sCR0 = 0x002704d5 (USFCFG=1); the only valid SMR is display 0x820/mask 0x402; UFS has no SMR. The SMMU inventory is read-only.",
]
