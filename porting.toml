configuration = ["R48 opts into fixed mode 1 with sm8250-gpu-ro=1 and smgop=1. The probe maps each window with VM_PROT_READ only once the upstream prerequisite checks permit access.", "R49 enables the temporary GPUCC mode-3 check with sm8250-gpu-cx=1. It restores modified bits after sampling.", "R50 uses sm8250-gpu-cx=2 and reads only GPU SMMU IDR0/1/2 after fresh CX and all required clock checks.", "R51 uses sm8250-gpu-cx=3 to read the board AOP command database and the current GMU clock configuration after SMMU verification."]
procedure = ["R59 selects sm8250-gpu-alioth=12. Stage the signed iOS 17 plugin and Turnip alongside the five R47 wallpaper records. Add the two signed binaries to an owner trust module. Mount the Extensions view before registering the 21H461 IOAcceleratorES subclass."]
findings = ["On IN2020, GCC and GPUCC were readable. CX and GX both read 0x00222001, and the SMMU vote clock read 0x80000000. The probe skipped SMMU and GPU reads, completed with io=0 and issued zero register writes.", "R49 brought GPU CX out of collapse, and GPUCC AHB and the SMMU vote clock read 0x00000001. Both touched bits were restored, with io=0 and writes=5/restored=5 as bitmasks.", "R50 re-sampled the GCC branches after CX power-up. MemNoC changed from 0x80004221 to 0x00004221 and SNOC DVM from 0x80000001 to 0x00000001. The GPU SMMU returned IDR0/1/2 0x4c017e06/0x20000005/0x00005511.", "The stock driver requires MIN_SVS (48) at 200 MHz. R51 read cx.lvl at 0x30000 and the first matching firmware ARC level 64 at index 2. The GMU source root and branch reported off.", "Persistent Data GPU addon gate repair: RAM capture 20261111-012320-33196 has WALL47 stage5 files11 and Preferences Metal fence182 completion. Current 20261112-221649-97620 has WALL47 stage1 EAUTH before install: fresh-data gate requires backend0. Use existing verified mounted-data readiness (persistent backend2/3 requires explicit no-passcode policy), retaining PID1, addon size/hash, original resource hash and read-only bindfs checks. Existing preferences remain O_EXCL; no Data reset or plugin replacement. Readiness harness rejects old gate and passes 120 cases. Persistent Metal runtime acceptance pending.", "Capture 20261112-224544-19080 SHA256 c94f1664e7237693d7897b3084ed1ac71a6bac4eff1481d9e0d2f6dc70996044 verifies backend2 volatile0, GPU59 registration, eleven addon files and backboardd/Poster GPU fence completion on image2316d4ee. User confirms Settings opens normally, but reports poor responsiveness and tearing. Current actual configuration has no sheng-fb-gpu; final scanout is CPU copy to active GOP with software60Hz cadence, not physical vblank. gpu-present-ownerdata-r1 SHA256 493568fd555fda131014d45d023346cc4e867cec10d04ef78842c688266a4965 only appends sheng-fb-gpu=1 sheng-early-retire=1 to actual FAT args. Native/embedded kernel, signed addon, trust, Data seed, ADT and boot chain stay byte-identical to the Settings-accepted parent. Historical early-retire0 stalled first swap; early-retire1 completed GPU copies but had single-core-era long waits. Current eight-core persistent test awaits user. No tearing fix or performance acceptance claimed.", "User2026-11-13 confirms gpu-present-ownerdata-r1 image493568fd: tearing gone and stutter clearly improved. Capture20261112-234127-48576 SHA2560eec6be0164b3b1baff5bfd102cdb4b5581281f88e2acb99bfeb5dd6a8dd1473: presenter ready line313, persistent backend2 volatile0 lines476-477, addon files11 written0 line481, GPU completed1-8 lines1598-1786. Preserve this user-confirmed improved baseline. Stability remains incomplete: backboardd pid56 watchdog SIGKILL line754 then replacement pid156;745 verify_swap rejection lines and variable early client timings. Do not infer physical vblank/pageflip or stable60FPS. Device-result.json separates user acceptance from runtime anomalies and prior host-only checks."]
completion = ["GPU submissions complete, mapping and fence handling are correct, a known image renders, and the selected Metal client presents it."]
limits = ["R48 verifies mode 1 on the board. R49 verifies GPU CX and the GPUCC clocks. R49 used a pre-CX snapshot for GCC. R50 verifies both GCC branches and GPU SMMU ID reads after power-up. The command database describes supported levels rather than the active CX vote. R53 verifies GMU clocks at 200 MHz. R54 verifies two GMU SMMU routes, firmware and HFI startup. R55 verifies GX power at 525 MHz and an accessible RBBM_STATUS. R56 completes the first kernel command and fence. R57 authenticates OnePlus ZAP, exits secure mode, and verifies the CP_NOP fence interrupt. R58 publishes NativeAdrenoGpu and completes one in-kernel IOUserClient submission and close. Userspace Metal and wallpaper presentation remain unverified."]
next_action = ["Preserve GPU-copy R1 as the user-confirmed improved baseline. Further GPU work should diagnose swap validation, initial backboardd watchdog and frame tail latency without reverting persistent Data or the successful display mode. No Wi-Fi transition inferred."]
