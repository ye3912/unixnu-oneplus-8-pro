inputs = ["IN2020 stock DTB places S6SY791 at SE13 I2C 0x48, with GPIO36/37 bus pins, GPIO38 reset and GPIO39 interrupt.", "The stock rails are ldoc1 at 1,800,000 microvolts and ldoa13 at 3,008,000 microvolts."]
configuration = ["R42 diagnostic mode uses sm8250-touch-probe=3. R44 publication uses sm8250-touch-probe=4 and sheng-touch-hid=1. Normal boot leaves these unset."]
procedure = ["Compare the SM8250 clock/DFS state, vote S5 and initialize the idle I2C engine. Hold reset low, check both LDO identities and voltage settings, then use the GF RPMh sender for the stock digital-first rail order. Release reset and read boot/integrity through the existing UniXNU GENI probe."]
findings = ["R41 qualified the physical rails and chip reads. R42 captured one physical down, move and up. R43 pure digitizer did not match the original event driver. R44 used the ShengHidInput composite descriptor, matched IOHIDEventDriver and passed the physical single-contact report lifecycle with handleReport returning success.", "2026-11-12 source inventory: factory i2c@984000 lists MXM1120 down/up at 0x0c/0x0d and IST8801 down/up at 0x18/0x19, with GPIO158/157 IRQs and ldoc10 supply. The listed alternatives do not identify the installed part. Hall coordination is in the supplied kernel oplus_tri_key.c, not the separate mechanical tri_state_key.c implementation.", "The opt-in sm8250-slider-probe=1 discovery patch runs once before the key worker acquires SPMI; it qualifies ldoc10 enable/voltage, GPIO4/5, GCC wrap0 S1 and firmware I2C state before reading DID register 0x09 at the four factory addresses. It restores idle controller configuration and releases its own clock vote. This is identification only; three-state classification and ringer integration are pending device evidence.", "Alert-slider identity candidate compiled and packaged as boot-instantnoodlep-alert-slider-id.img, SHA256 5b4e5e7b20772cfab723752d82351df38b28ac6b32840fbf599f61445254e904. Final source matches the compiled XNU tree, key-worker import resolves to the executable linked probe, and payload comparison changes only kernel.macho and the opt-in argument. Device identification remains unverified.", "The 20261112-123751 capture lines340-344 show missing wrap0 slave-AHB vote, GPIO4/5 still GPIO inputs, and L10 type4/subtype7d at3312mV disabled. The next board patch votes the factory clock bits and input mux, binds only ldoc10 from the uniquely named firmware VREG command-DB entry, requests3008mV and verifies it before enable. Both candidate sensor voltage ranges contain3008mV. No sensor configuration or ringer-state writes are included.", "The power-ID candidate passed the focused before/after command-policy check and the full kernel build. Packaged image SHA256 2e01f0a2107987b15204052dbc38702a0590b3c31d7d5c835c3575142777a42a changes only kernel.macho from the first ID image, retains the existing opt-in argument and3GiB seed, and has no device identification result yet.", "The 20261112-132444 capture lines342-345 confirms wrap0 votes and S1 clock enabled, I2C firmware303 and idle state0, with engine output IRQ gate0xf. The former master-IRQ-enable rejection stopped the probe before the power helper. The polling candidate accepts only the observed idle default0xf or masked0, still qualifies GSI/DMA/FIFOs and active-state bits, masks the four engine output gates with readback, then restores the saved gate on idle exit. The existing clock, power and DID policies are retained.", "Idle GENI polling handoff candidate passed full build and packaging, image SHA256 18108555e39f865dd95a8e8b5dc0b8cf69844df9043bf52185b4d7f0ccd496b7. Generated source matches the candidate and only payload kernel.macho differs from power-ID. Await actual masked-output, L10 and DID results before claiming slider identification.", "The 20261112-134127 capture lines344-350 confirms masked IRQ handoff and firmware ldoc10 address41500, with acknowledged3008mV request but disabled PMIC VSET still3312mV. The prior extra pre-enable physical-readback condition prevented the enable request. This candidate follows vendor qcom-rpmh-regulator.c set_enable_state: acknowledged voltage request, then enable, followed by bounded actual PMIC enable/voltage readback. Device cause of the stale pre-enable VSET remains unresolved; no identification is accepted without final enable80 and3008mV.", "Vendor voltage-vote then enable candidate built and packaged, image SHA256 dc2c55e8a60dfd7c135bb263db86fc4cbc21e1249a840b42fffd1b7ae3ac02c1. Final source matches generated XNU and only payload kernel.macho differs from poll-ID. Disabled rails always establish a3008mV vote before enable. Actual enabled PMIC state and sensor identity remain unverified.", "The 20261112-141931 capture lines343-352 confirms both RPMh voltage and enable commands completed, and observed PMIC enable changed0->80 while VSET remained3312mV. No DID transaction occurred because the old exact3008mV acceptance failed. The iSentek IST8801 product page specifies1800..3600mV, the supplied MXM1120 driver specifies2700..3600mV, and the factory board L10 interval is3000..3312mV. This candidate requires actual enable80 and that narrower shared interval, reports requested versus observed voltage separately, and does not claim exact3008mV control or a proved aggregation cause. The existing3008mV command encoder is unchanged.", "Source-backed3000..3312mV Hall-ID candidate passed full build/package, image SHA256 01da13c08326fdad31d4ab3441bc8c1a8403ec1717a639a329b6cd5a93f2baaf. Final source matches generated XNU and only payload kernel.macho changes. Exact voltage control and actual sensor identity remain unverified; in-range supply acceptance is not a3008mV regulation claim.", "The 20261112-182928 capture lines353-359 identifies a full IST8801 pair at18/19, each DID81, with idle/restored GENI and restored IRQ output. The sample candidate uses the supplied IST8801 reset_device and20Hz measurement register profile, with the documented polling bit instead of threshold IRQ mode. Mode2 transfers controller ownership to nonblocking polling from the existing16ms key worker; mode1 retains ID-only behavior. It records signed up/down values and ST1 validity at most once per second after the first8 pairs for up to30minutes, with bounded asynchronous timeouts. Three-state thresholds, calibration and iPadOS ringer mapping remain unimplemented and require labelled physical positions.", "IST8801 raw-sample candidate passed full build/package, image SHA256 e772b81bfcd01bad18628307bca6170a461dfa4793da3d3bd92769cb84f46e76. Both final C sources match generated XNU, key-worker poll/stop imports resolve, and payload changes only kernel.macho plus mode1->2. Await labelled top/middle/bottom raw values, sensor-init readbacks and confirmation that physical keys remain responsive. No calibrated position or ringer behavior is claimed.", "The 20261112-185615 capture SHA256 65b1d9aa73dd890d7fd553129cf088bf76d76f1123b0dd3758e05304c34acdb5 initializes both IST8801 parts and reaches3120 pairs over417.7 seconds, with397 printed pairs all status15/15 valid. User confirmed top boot and middle/bottom/middle/top movement. Observed difference groups are around-232, near0 and+223. Mode3 adds handset-calibrated bounded difference windows and factory sum tolerance40, plus board policy of3 consecutive valid pairs spanning200ms with500ms maximum gap. It logs initial and changed physical position only, leaving modes1/2 unchanged. Standalone checks cover bad status, magnetic offset, deadband, debounce, boot positions and direct moves. Classification remains pending device validation; no system ringer or haptic event is connected. Capture still ends at30minutes and is not a production slider service.", "Mode3 recognition candidate fully rebuilt and packaged as alert-slider-ist-position, SHA256 494375acae25f73598dad6c406cc7c0d373d51e03f870816036fab64c2fb65bd. Native and delivered source hashes match; only kernel and mode2-to3 config differ from the device-tested raw sampler. Position changes are logged with ringer=unbound; recognition remains pending a labelled device run and input area is not promoted to fully verified.", "Capture20261112-191555 SHA256 578029380948ed8ebcfc4047393ae9de6633c83f850197fa6653adb8124ead65 device-verifies initial up and exactly up/middle/down/middle/up with835.539seconds of no repeated position events. Last pair6288 at849.152seconds; no slider timeout/failure or kernel panic observed. This supersedes pending mode3 recognition for this tested sequence only. All events retain ringer=unbound; physical classification is distinct from system ringer and haptic integration. Alternate boot positions, direct end-to-end moves and capture expiry remain unverified.", "Mode4 connects the device-verified physical slider to a dedicated original-ABI In2020RingerService. The pinned21H461 backboardd compares page11 usage46, stores down0=silent/down1=tone1, and queries initial state with matching type3. The service implements query plus state-change dispatch, waits for a confirmed position before publication, maps upper and middle to silent and lower to ring, and never invents a vibration event. It shares the existing controlled IOHIDEventService class-registration and binding recipe; both219-slot vtables and exact type3 keyboard layout are audited. Sampling stays in the existing key worker, mode4 removes30min expiry, and transport loss invalidates source without a guessed system toggle. System behavior remains pending device acceptance.", "Ringer integration fully rebuilt and delivered as alert-slider-ringer SHA256 21fda6fe1027d5e4deae0489aa5221ec9f707c3be7a485b38a54fb7a75f7890c. Both219-slot HID vtables and keyboard32-byte layout pass the pinned original ABI audit; native class and atomic position getter link. Only kernel and mode3-to4 config changed. Upper/middle=silent, lower=ring; initial query and change dispatch are implemented. Device/native-client/UI acceptance remains false; haptic/vibrate policy and automatic transport recovery remain open.", "Capture20261112-212957 SHA256 5e8bc13fa2531d6f977ce7e1837f0f859754f7f8dc2722a01ff2965840b703d5 device-verifies mode4 service start, initial matching type3 query answered1 atline783, native event conversion/getter checks and state dispatch0/1/0/1/0 atlines531/984/986/1019/1025. Middle causes no duplicate binary event; direct end-to-end source changes also appear. No slider/ringer failure or kernel panic observed. User did not watch the mute indicator; UI and audible acceptance remain unverified, haptics unimplemented. Current image suffices for indicator observation; no new ID/raw/position diagnostics are needed.", "The214713 capture SHA will be recorded with user UI-failure evidence: repeated native query/dispatch did not change the mute icon. Original keyboard factory code proves manual event defects: options must include absolute1, pressCount is data byte28 and data word24 contains longPress/clickSpeed. The old encoder put1 atword24, left pressCount0 and absolute0. The candidate removes manual event serialization entirely and binds the pinned original IOHIDEvent::keyboardEvent entry plus the original slot31 sender setter. Initial query, source state policy, Hall sampling, identity, ADT and Data remain unchanged. Fixing this proven defect does not yet prove it was the sole cause; native UI acceptance still requires device observation.", "User UI-failed214713 log SHA256 8eff0ddfe2dbe8921831f49430d7d40442301cd878d3ce571d7682030eb2d4b8 disproves full acceptance of the previous ringer image. Original21H461 factory proves manual event count/longPress/absolute-option defects. New alert-slider-native-ringer candidate SHA256 5a4acee3ae14a66330457211dce2d059d8506164e5bc1a95a81f529b07259df6 calls the pinned original keyboard factory and original sender setter; actual linked factory VA4afb5b0 and both219-slot ABI audits pass. Only kernel.macho changes; ADT/config/identity/Data remain identical. This fixes a proven implementation defect but sole-cause and UI acceptance remain unproven. Haptics remain unfinished."]
