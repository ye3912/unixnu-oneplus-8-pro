[[area]]
id = "storage"
status = "implemented"
components = []
paths = ["drivers/Sm8250Ufs/**", "scripts/build-sm8250-ufs.py", "configs/instantnoodlep_defconfig", "dts/instantnoodlep.dts"]
inputs = [
  "Controller: qcom,sm8250-ufshc, qcom,ufshc compatible, host 0x01d84000/0x3000, ICE 0x01d90000/0x8000, GIC SPI 265 (interrupts stay out of the ADT until the driver uses them). Source: arch/arm64/boot/dts/vendor/qcom/kona.dtsi ufshc_mem.",
  "PHY: qcom,sm8250-qmp-ufs-phy at 0x01d87000/0xe00, two lanes, 19.2 MHz reference; the vendor tree ships phy-qcom-ufs-qmp-v4.c, not mainline phy-qcom-qmp-ufs.c. Source: kona.dtsi ufsphy_mem, phy-qcom-ufs-qmp-v4.h.",
  "Clocks: GCC at 0x00100000; nine UFS branches with their CBCR offsets (axi 0x77010, ahb 0x77018, tx_symbol_0 0x7701c, rx_symbol_0 0x77020, unipro_core 0x7705c, ice_core 0x77064, phy_aux 0x7709c, rx_symbol_1 0x770b8, aggre_ufs_phy_axi 0x770cc). Source: drivers/clk/qcom/gcc-kona.c.",
  "Reset and power: GCC_UFS_PHY_BCR at 0x77000 bit 0; controller-side PHY soft reset is REG_UFS_CFG1 (host 0x0dc) bit 1; ufs_phy_gdsc at 0x177004 with SW_COLLAPSE bit 0 and PWR_ON bit 31. Source: kona.dtsi qcom,gdsc@177004, ufs-qcom.c ufs_qcom_power_up_sequence and ufs_qcom_full_reset.",
  "DMA: no iommus property on the kona ufshc node, so DMA uses physical addresses; no apps-SMMU context or stream takeover is needed.",
  "Handoff: measured on hardware. pre21 reads HCE=1, HCS=0x010f, CAP=0x1587031f, RSR=1, DBR=0, UTRLBA in the DXE heap, all nine CBCR enabled with no CLK_OFF, four RCG roots running (cmd ROOT_OFF=0), ICE ctrl=0/bypass=0x80000000, and UIC IS cleared. The XBL pre snapshot is IS=0x400 (UIC_COMMAND_COMPL) and its list base changes per boot. The vendor UEFI UFSDxe is not in this firmware because its trusted-zone application needs the tz partition.",
  "Storage layout: capacity, LUN count and GPT are not read; no SCSI command has completed.",
]
configuration = [
  "CONFIG_XNU_NATIVE_UFS=y in configs/instantnoodlep_defconfig; the archive build is scripts/build-sm8250-ufs.py, which produces build/sheng-ufs/libShengUfs.a for the existing CONFIG_XNU_NATIVE_UFS link path.",
  "board.toml [kernel] archives runs build-sm8250-ufs.py; kernel_args carry native-ufs-probe=25 (21 pre-ring dashboard, 22 empty UTRD, 23 HIBER_EXIT then TUR, 24 HIBER_EXIT plus UIC error codes, 25 full cold start then TUR) and native-ufs-probe-delay.",
  "sm8250.dtsi enables ufshc and ufsphy with unixnu,adt-name; interrupts stay commented out because a specifier here panicked in IODTGetICellCounts.",
  "The driver keeps the runtime class NativeUfs so the KernelConfigTables personality applies; hardware work runs from the root-device personality in a delayed kernel thread.",
]
procedure = [
  "Record controller, PHY, clock, reset, power, DMA and handoff state before programming anything (docs/porting/ufs.md step 1).",
  "Two initialization paths exist: a full cold start (GDSC, nine branches, BCR pulse, REG_UFS_CFG1 PHY reset, QMP v4 tables, SerDes start, PCS poll) for level 2, and a firmware-state takeover (stop both lists, program a physically contiguous request list, start UTRL) for levels 15 and above. The kebab path does not run the cold start; QUNIPRO select is written but this firmware ignores it.",
  "Build the archive with scripts/build-sm8250-ufs.py and link the kernel with CONFIG_XNU_NATIVE_UFS=y.",
  "Verify milestones in order: register access, empty-list doorbell retirement, command completion, known-block reads, root mount, persistence. Do not expect a post-ring panic: the stall takes the display path within tens of milliseconds.",
]
findings = [
  "ShengUfs is a warm-boot takeover: it has no clock enable, PHY initialization, link start or power sequence, and its build hard-requires the VerifiedRoot closure, so it cannot be selected unchanged for this board.",
  "The qcom gdsc driver clears SW_COLLAPSE (bit 0) and waits for PWR_ON (bit 31); 0x177004 is exactly GCC_BASE + 0x77004, the same offset SM8550 uses for its GDSCR.",
  "Branches with hwcg_bit=1 report CLK_OFF while idle, so CLK_OFF must not be read as a failed enable. pre21 measured all nine CBCR enabled with bit31=0.",
  "The PHY tables must be written between UFS_PHY_SW_RESET assert and deassert, and the controller-side PHY soft reset wraps the whole sequence as in ufs_qcom_power_up_sequence.",
  "0x770cc is rx_symbol_1 on SM8550 but aggre_ufs_phy_axi on kona; copying the old header would silently clock the wrong branch.",
  "The UTRLDBR=1 store does not retire with the kebab takeover. ring17-20 changed clk_req, the SMMU wildcard, the 4 GiB low allocation and the helper-thread ring independently; all four images showed the same second-row-1 store stall, so those four variables are excluded.",
  "empty22 rang an all-zero UTRD (no valid command) and the store still did not retire: descriptor content, UCD/PRDT and the fetch path are not required for the stall.",
  "The pre21 pre IS 0x400 is UIC_COMMAND_COMPL, not a UTP error; the XBL left the last UIC command completed. hiber23 sends DME_HIBER_EXIT (0x18) but the following TUR store still does not retire.",
  "The only valid SMR is the display stream 0x820; UFS has no SMR and sCR0.USFCFG=1. The SMMU wildcard did not fix the stall and is not on the critical path.",
  "uic24 sent DME_HIBER_EXIT and read the five UIC error-code registers: hib=1, DME=0x80000001 (Err bit31, Ec bit0), PA/DL/NL/TL=0, HCS=0x10f. The DME layer rejects HIBER_EXIT; the link is up, so the H8 hypothesis is not supported and cannot be tested by this command.",
  "full25 ran the complete kernel cold start (HCE off, GDSC/branches/BCR/CFG1 PHY reset, QMP tables, PCS, QUNIPRO), HCE on, DME_LINK_STARTUP and HCS.DP. The cold-start, link and DP blocks were all green, but the TUR doorbell store still did not retire. The kernel-side init is therefore not the missing piece.",
]
completion = [
  "Host: registers readable and the measured clock/PHY/link values recorded (docs/porting/ufs.md milestone 1).",
  "DMA and commands: the doorbell store must retire for an empty list and for a bounded command, which must complete with a checked OCS and SCSI status (milestone 2).",
  "Block reads: capacity and known blocks match the selected LUN and 4096-byte logical block size (milestone 3).",
  "Root: GPT and root windows bounded; the configured root mounts and starts userland (milestone 4). Persistence: writes survive the documented reboot/reset sequence (milestone 5).",
]
limits = [
  "Registers have been read on hardware, but no SCSI command has completed and the UTRLDBR store does not retire; capacity/LUN/GPT/root are unread.",
  "The kebab path does not run the full cold start; the PHY/BCR/HCE combination has not been tested with a doorbell.",
  "HIBER_EXIT returns 1 with a DME-layer UIC error (0x80000001) while PA/DL/NL/TL are 0; the DME rejects the command, so H8 is not supported. The full PHY/BCR/HCE/link cold start is green but the doorbell store still does not retire.",
  "The probe panics by design and does not publish a block device or root; post-ring panic output is not available in this stall.",
]
next_action = [
  "Make the HIBER_EXIT result visible before the ring (level 23b), then test the empty-list store after a confirmed wake.",
  "Test the firmware handoff: build instantnoodlepPkg with INSTANTNOODLEP_STORAGE=1 and INSTANTNOODLEP_TRUSTZONE=1 so the vendor UFSDxe/TzDxe are present, then compare the doorbell store. If UFSDxe fails on the TZ application, make the failure non-fatal after the host/domain init or reuse the kebab firmware configuration.",
]
evidence = [
  { kind = "source", reference = "drivers/Sm8250Ufs/Sm8250Facts.h", result = "Windows, GDSC, nine CBCR offsets, BCR, host registers, UIC opcodes and the two QMP v4 tables, each cited to the vendor tree" },
  { kind = "source", reference = "drivers/Sm8250Ufs/NativeUfs.cpp", result = "Cold start, kebab takeover, empty-slot ring, pre-ring dashboard, DME_HIBER_EXIT and the RAM-only ring report" },
  { kind = "source", reference = "scripts/build-sm8250-ufs.py", result = "Replays the XNU compile record and produces build/sheng-ufs/libShengUfs.a without the VerifiedRoot closure" },
]

