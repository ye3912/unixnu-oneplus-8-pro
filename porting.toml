schema_version = 1

[device]
name = "instantnoodlep"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 8 Pro (IN2020), XNU10063/4KiB and iPadOS21H461. H3G hardware: original PID1 mprotect handler returned0 for32KiB VM_PROT_READ; H3H observes same-thread later EL0 SVC."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore"]
inputs = [
  "SoC: Qualcomm SM8250 (kona). Device: OnePlus 8 Pro, IN2020.",
  "OS profile: ipados-17.7.11-21H461, inherited unchanged from sheng.",
  "SoC source: UniXNU-sm8250-common.",
]
configuration = [
  "board.toml: soc = SM8250, soc_source = sm8250, os_profile = ipados-17.7.11-21H461, kit = instantnoodlep.",
  "components.include: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink, DarwinBoot.",
  "kernel.config_fragments and kernel.patch_series carry the full ordered arrays.",
  "payload.dram_size = 0x200000000 equals the memory node size; the ADT step rejects a mismatch.",
]
procedure = [
  "./unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep",
  "./unixnu status --json -D ../UniXNU-instantnoodlep",
]
findings = [
  "Kernel probe level advanced to 25: 21 pre-ring dashboard, 22 empty UTRD, 23 HIBER_EXIT then TUR, 24 HIBER_EXIT plus UIC error codes, 25 full cold start then TUR; level 15 is reused with the STORAGE=1/TRUSTZONE=1 firmware to preserve the vendor UFS init. The QR-enabled firmware image also sets payload tools=true, adding the Tools menu. Images and hashes are archived under builds/2026-10-28.",
  "The vendor keeps the board device tree split: the boot image carries base kona trees with board-id 0, dtbo.img carries nine overlays selected at runtime, and dtbo entry 0 is this board (model 'kona MTP 19811').",
  "The UEFI firmware lives in the xbl partition, not in a separate uefi partition: SEC core plus one DXE volume compressed under a custom GUID 1d301fe9-be79-4353-91c2-d23bc959ae0c, which UEFIReader handles and a plain FFS parser does not.",
]
completion = ["All source pins resolve; status shows four merged profiles, the five components in dependency order, and an empty device patch series."]
limits = ["The SoC repository is unpublished and reached through a local path in feeds.toml."]
next_action = ["Publish UniXNU-sm8250-common and pin its commit in feeds.toml."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Declares the four merged layers, the five selected components and the ordered patch series the checker resolves" },
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = [
  "Mu-Silicium platform package instantnoodlepPkg, FD base 0x9FC00000 size 0x300000, BootShim with the ARM64 image header.",
  "Boot image: Android boot v1, kernel field gzip(BootShim + FD) + appended device tree, ramdisk = payload FAT volume.",
  "Appended device tree: the vendor tree instantnoodlep-dtb/instantnoodlep.dtb (723,328 bytes), which carries qcom,msm-id, qcom,board-id and /chosen. The 2 KB ADT tree (device-tree/hardware.dtb) is for the kernel only.",
]
configuration = [
  "VENDOR_HW=1, STORAGE=0, TRUSTZONE=0, USE_CUSTOM_DISPLAY_DRIVER=0 in instantnoodlep.dsc.",
  "bootimg --dtb must point at the vendor tree; the payload ADT is generated from device:dts/instantnoodlep.dts plus soc:dts.",
]
procedure = [
  "Build kernel, payload and firmware, then pack the boot image with the vendor device tree and flash it to boot_a.",
]
findings = [
  "On 2026-10-27 the boot image was repacked with the 2 KB ADT tree instead of the vendor tree; every image from 14:13 onward was then refused by ABL and returned to fastboot with no UEFI output, while images carrying the 723 KB vendor tree still printed the DXE log.",
  "The vendor tree is what ABL uses for platform matching and for writing /chosen/linux,initrd-start and -end; the UniXNURamDiskDxe handoff depends on those properties.",
  "The flashed FD is built with INSTANTNOODLEP_STORAGE=0 and INSTANTNOODLEP_TRUSTZONE=0: APRIORI.inc/DXE.inc include SdccDxe/UFSDxe only when STORAGE=1, so the vendor UFS DXE and TzDxe are absent. Kebab includes both unconditionally and its kernel UFS driver relies on the firmware host/domain state.",
  "full25 proved the kernel can run the complete PHY/BCR/HCE/link cold start (cold/link/DP blocks green) but the UTRL doorbell store still does not retire. The missing vendor UFS DXE/TZ handoff is therefore the leading remaining difference.",
  "The STORAGE=1/TRUSTZONE=1 firmware build includes UFSDxe (GUID 0d35cd8e-97ea-4f9a-96af0f0d89f76567) and seven additional TZ/PIL/SPSS/Sdcc modules; the FD stays 0x300000 (sha256 73cd521b...). It is paired with probe=15 (kebab takeover, no kernel cold start) in boot-ufsdxe15.img so the vendor host init/domain is preserved.",
  "AdvancedLogDxe (GUID 8d4e7f50-3a2c-4c9a-9e1b-50c4c8472d41) and QrEncoderLib are now integrated; the FD has 93 modules and sha256 189defe1..., and payload tools=true adds the Tools menu entry. The QR-enabled image is boot-ufsdxe-qr15.img.",
  "The STORAGE=1/TRUSTZONE=1 QR image does not reach the menu on hardware; the vendor UFSDxe/TZ chain is fatal before BDS. A second build keeps STORAGE=1 but sets TRUSTZONE=0 (FD 850203e9..., 88 modules, UFSDxe + AdvancedLogDxe, no TZ), image boot-ufsdxe-qr-notz15.img, to isolate UFSDxe from the TZ chain.",
  "The no-TZ image still does not reach the menu: it asserts in ArmCpuDxe/CpuExceptionHandlerLib with ESR EC=0 (unknown/SError class) and frames in ArmGulba/BootCore. STORAGE=1 also includes SdccDxe, and this board has no usable SD path, so SdccDxe is a plausible cause. The next build removes SdccDxe (FD 7fd25ef3..., 87 modules, UFSDxe + AdvancedLogDxe only), image boot-ufsdxe-qr-nosdcc15.img.",
  "The exception is also new relative to the working STORAGE=0 firmware, so the AdvancedLogDxe/DebugLib mapping itself is a variable. A control build keeps STORAGE=0/TRUSTZONE=0, keeps AdvancedLogDxe/QrEncoderLib and tools, and removes UFSDxe/SdccDxe (FD de49b348..., 86 modules), image boot-qr-control15.img. It must boot before the UFSDxe image can be interpreted.",
  "Control result on hardware (2026-10-29): the menu appears and Tools -> Advanced Logger opens. The logger/DebugLib chain is sound; the ArmCpuDxe assert with the UFSDxe builds comes from UFSDxe or SdccDxe.",
  "The UFSDxe-only no-TZ no-Sdcc image also fails before the menu, so UFSDxe alone asserts. The last untested quadrant is UFSDxe + TZ without Sdcc (FD 176c0e25..., 92 modules, UFSDxe + TZ 1c04f529 + AdvancedLogDxe), image boot-ufsdxe-tz-qr-nosdcc15.img.",
  "The UFSDxe + TZ no-Sdcc image also asserts before the menu. All four vendor UFSDxe combinations (with/without TZ, with/without Sdcc) fail. The vendor UFSDxe cannot be enabled on this Mu-Silicium chain as-is: it raises an exception in ArmCpuDxe/CpuExceptionHandlerLib rather than returning a recoverable DXE error.",
  "A local UefiCpuPkg/CpuExceptionHandlerLib patch adds a DXE-only Adv library instance (DxeCpuExceptionHandlerLibAdv, GUID ...E02E) that captures the Advanced Logger tail at the start of DumpCpuContext and prints it to ConOut before ASSERT; the ArmCpuDxe component in the platform DSC overrides CpuExceptionHandlerLib to this instance. The FD is 77893447... and the image is boot-ufsdxe-tz-qr-exc15.img.",
  "exc15 on hardware: the assert text appears but no 'Advanced Logger tail:' line. Root cause traced in the sources, not guessed: the tail was printed through gST->ConOut, which does not exist yet at that point. APRIORI.inc puts UFSDxe at line 56 and TzDxe at line 64, while SimpleTextInOutSerial/ConSplitter/GraphicsConsoleDxe only dispatch at lines 102-105, so gST->ConOut is NULL and PrintAdvancedLoggerTail returned silently. The rest of DumpCpuContext is visible because it goes through SerialPortWrite, which the platform maps to SiliciumPkg/FrameBufferSerialPortLib (SiliciumPkg.dsc.inc:162) and paints the framebuffer directly.",
  "Capture itself was not the problem: DxeCore.efi contains gAdvancedLoggerProtocolGuid, so the logger protocol exists before any DXE driver, and the access library's [Depex] gAdvancedLoggerProtocolGuid merged into ArmCpuDxe, which therefore cannot dispatch before the protocol is published. mLoggerInfo was resolved, and the tail data was in the ring but never printed.",
  "Run 2 (boot-ufsdxe-tz-qr-exc15b.img, FD aed31e98..., image 74924e22..., 93,929,472 B): PrintAdvancedLoggerTail now writes through SerialPortWrite and the header reports the entry count and the final access-library status, so an empty capture is distinguishable from a missing logger. Verified end to end: embedded FD equals the rebuilt FD, the new ArmCpuDxe (62ded8ba...) is inside the LZMA inner FV, the vendor DTB is the 723,328-byte tree, and the payload kernel.macho is unchanged (4412b0fb...).",
  "Expectation for the vendor stage: UFSDxe and TzDxe are prebuilt binaries under Binaries/instantnoodlep, so their own DEBUG/ASSERT text goes to the vendor's serial debug library and does not enter our Advanced Logger. The tail can therefore only show how far DXE dispatch got and what our own modules did last; it cannot contain UFSDxe's internal failure message.",
  "UFSDxe binary analysis (Binaries/instantnoodlep/QcomPkg/Drivers/UFSDxe/UFSDxe.efi, FFS GUID 0d35cd8e-97ea-4f9a-96af0f0d89f76567, 0x220d6 bytes): its DXE_DEPEX requires nine protocols (157a5c45..., b0760469..., 5bef7c41..., c1bff82d..., a966cc4f..., 47861dff..., ad9aec18..., b27ae8b1..., f4e5c7d0-d239-47cb-7f66ef763238). ScmDxeLA sits in APRIORI outside the TRUSTZONE gate, so the SCM protocol exists even in the TZ=0 builds and UFSDxe does dispatch there; its failure is a runtime fault, not a missing dependency.",
  "UFSDxe strings describe its runtime flow: Locate TzeLoader/Qseecom, Loading storsec from TZAPPS (qcom.tz.storsecapp), UFS IOMMU domain create/configure/attach ARID 0x10 (card ARID 0x0), Failed to map UFS_MEM_UFS, EnableUfsIOC, the nine gcc_ufs_phy_* clocks, /pmic/client/ufs0, and OnePlus-specific UFS firmware upgrade from oplusreserve1. It also carries 'SerialPort Lib' and the standard DebugLib/ASSERT strings, i.e. its debug output goes through its own linked SerialPortLib instance, not ConOut and not our Advanced Logger, so reordering it after the console drivers would not reveal its messages.",
  "Upstream kebabPkg in the same Mu-Silicium tree includes UFSDxe and TzDxe unconditionally (APRIORI.inc lines 20/31/44/48) and has no STORAGE/TRUSTZONE switches; its MemoryMapLib also has no separate UFS/ICE descriptor because both fall inside APSS_HM (0x17800000, 0x0d981000), exactly as in instantnoodlepPkg. There is no memory-map or module-roster difference to copy; the kebab vendor binaries themselves are not in the tree (only Binaries/instantnoodlep is present).",
  "exc15c (boot-ufsdxe-tz-qr-exc15c.img, image e59dd8e7..., FD e9c80d05..., 93,929,472 B) adds a compact FAULT EC/IL/ESR/ELR/FAR line immediately before the tail header, so the register-based diagnosis sits at the bottom of the screen instead of above ~50 lines of CPU dump. Verified: embedded FD matches, the new ArmCpuDxe (d2e6756a...) is inside the inner FV, the DTB is the 723,328-byte vendor tree.",
  "Hardware log (2026-10-29) names the vendor failure: UFSDxe loads, prints ufs_error_log: 28b, then ASSERT_EFI_ERROR (Status = Device Error) and ASSERT UFS.c +1029. Static decode: 0x28b is emitted by the low-level execute path when the command returns its internal -1000 retry sentinel and the follow-up response read then fails; the function that logs it builds a SCSI WRITE(10) CDB (opcode 0x2A), consistent with the OnePlus ufs_set_pon_write_protect string. The UFS.c:1029 assert is secondary: the request-object allocator (about 20 slots) returns NULL and the code asserts EFI_DEVICE_ERROR. So the root event is a non-completing write command, not the assert.",
  "Stock images (C:/Users/29664/Desktop/images): xbl_a.img is ELF64 with one FV whose DXE volume is GZip-compressed under the custom GUID 1d301fe9-be79-4353-91c2-d23bc959ae0c (UEFIReader's ZLib/GZip branch, not LZMA). Decompressed, it contains a valid IORT (4468 B, QCOM) with named-component entries for \\_SB_.UFS0, but no DSDT (ACPI tables are built from ASL at runtime), and abl_a.img has no DSDT either. The stock APRIORI.inc lists no ACPI drivers at all and puts TzDxeLA at line 9, before UFSDxe at line 55.",
  "Therefore the ACPI/UFS0 gap is real (instantnoodlep DSDT is 354 B with only CPU0-7; UFSDxe references \\_SB_.UFS0) but is not the entry-time blocker: stock dispatches UFSDxe before any ACPI platform driver too. An SSDT adding UFS0 (MMIO 0x1D84000/0x1C000, IRQ 265 from the board DTS, DEV0 _ADR 8) was compiled but deliberately not integrated.",
  "The remaining concrete ordering delta: our APRIORI put UFSDxe at line 56 and TzDxeLA at line 64, i.e. after it, while stock puts TzDxeLA at line 9. Since the failing WRITE goes through storsec/ICE, UFSDxe may run before the TZ services it needs. boot-ufsdxe-tzfirst15.img moves the TzDxeLA block before the UFSDxe block and changes nothing else (image 1a930f84..., FD 6be7ecf8...). Hardware still reported ufs_error_log: 28b + UFS.c:1029, so the ordering is not the cause.",
  "Reverse engineering pinned the failing function: ufs_set_pon_write_protect at RVA 0x28cc (reached through the RVA table at 0x18790 with entries 0x27a4/0x28cc/0x2c48/0x305c/0x2bf0). It locks, calls 0xcf08, and on failure prints 'ufs_set_pon_write_protect with return value of %d' and returns EFI_DEVICE_ERROR; the caller then exhausts the fixed request pool and asserts at UFS.c:1029. So the root event is the OnePlus power-on write protection write failing, not the assert.",
  "Non-fatal experiment: UFSDxe.efi was patched at 0x28cc to 'mov w0,#0; ret' (original sha 38d0db94..., patched a3fcc1ff..., backup kept as UFSDxe.efi.orig; script tools/patch-ufsdxe-writeprotect.py). Write protection is not required to read or mount the device. Image boot-ufsdxe-nowp15.img (image 24c27ace..., FD f0309c52...), verified to contain the patched module with 00 00 80 52 c0 03 5f d6 at 0x28cc.",
  "Correction after re-checking function boundaries: 0xdce4 belongs to the function at 0xdc08, which issues TEST UNIT READY (CDB[0]=0), not to the WRITE(10) or WRITE BUFFER functions. The write-protect, short-transfer and FFU-skip patches were based on wrong function attribution and changed nothing on hardware; the stock UFSDxe was restored (38d0db94...).",
  "GFander published GFander/kebab-UEFI with the missing recipe in patches/0002-kebab-boot-to-BDS-UFS-init-no-longer-fatal.patch: (1) ConfigurationMapLib EnableUfsIOC 0->1, without which UFSDxe asserts with Device Error and CpuDeadLoop()s the machine; (2) MemoryMapLib gains a UFS UFS REGS MMIO descriptor at 0x01D80000/0x20000; (3) a CPU Vectors 0x9FF8C000 entry that instantnoodlep already has. instantnoodlepPkg had EnableUfsIOC 0. Both changes are applied; image boot-ufsdxe-ioc15.img (image 816b98a5..., FD ab7726fe...).",
  "Expectation from GF's own note: this makes the machine reach BDS with the menu while UFSDxe may still report UFS errors and expose no block device; his working root filesystem comes from the kernel driver, not from UFSDxe. The repo also carries a source UEFI UFS driver at src/Silicon/Silicium/SiliciumPkg/Drivers/QcomUfsDxe/QcomUfsDxe.c.",
  "Clean rebuild after concurrent edits (2026-10-29): the firmware tree was verified coherent (one EnableUfsIOC=1 entry, one UFS UFS REGS descriptor, stock UFSDxe 38d0db94, no duplicate lines) and rebuilt with Build/instantnoodlepPkg removed first. Image boot-ufsdxe-ioc-clean15.img (image 9991da17..., FD 5d8d748a..., 0x300000), UFSDxe 38d0db94 inside the FV, vendor DTB 723,328 B. Note the FV also embeds a vendor text blob 'EnableUfsIOC = 0' (default cfg); GF's patch changed only the ConfigurationMapLib table, which is the effective source, so the text blob was left untouched.",
  "Full reverse of the vendor UFSDxe (tools/ufsd-re-analyze.py, report ufsdxe-full-re.md; supersedes the two findings above): EfiEntry 0x114c -> init 0x33f4 maps +UFS_MEM_UFS via the HWIO protocol, configures the HALIOMMU domain (the UFS0 ACPI device, ARID 0x10, protocol 54B6D3B4-...) successfully, then calls UfsAllocAndExecute 0xcc78 which lazily runs UfsHwInit 0x11a24 (register base hardcoded 0x1D80000 so +0x40xx equals 0x1D84000+standard offsets; PHY pokes 0x1D98004=0x5F, 0x1D87C00, 0x1D870BC; HCE=0, CFG1=0x1800052E, UIC work, HCE=1; a fresh 0x1400 page into UTRLBA and UTMRLBA; poll UTRLRDY; UTRLRSR=1 and never stopped) and executes TEST UNIT READY as the first command.",
  "The TUR answers SCSI CHECK CONDITION (response UPIU status 2) with sense data; the driver parses the sense and only retries UNIT ATTENTION (key 6), so any other key logs 0x28b and UfsAllocAndExecute returns NULL, which is the UFS.c:1029 assert at 0x35d0 in init 0x33f4. No 0x2a0/0x2a1 log lines appear, so the sense format is valid. The UTP transport (doorbell, fetch, response, sense) therefore works in our firmware - the assert is a device-state refusal, not a DMA/IOMMU or register-map problem. The vendor doorbell is a plain slot-mask store to regs+0x58 with DMB and cache-clean of UCD/PRDT before it.",
  "Hardware with boot-ufsdxe-sensekey15.img read the sense key as 2 (NOT READY). Earlier vendor-binary patches (PON write protect 0x28cc, short-transfer 0xff04, FFU 0x12410) were built on misread function boundaries, changed nothing and are reverted; UFSDxe.efi.orig (38d0db94...) is the stock binary.",
  "Open-source UFS stack built (2026-10-29 late, Mu-Silicium-beta branch oss-ufs, commit 8e8bc70): GF's route is firmware-side, not a kernel driver. A 419-line QcomUfsDxe adapter (kebab-uefi/QcomUfsDxe.c) provides EDKII_UFS_HOST_CONTROLLER_PROTOCOL and EDKII_UFS_HC_PLATFORM_PROTOCOL at 0x01D84000 with SkipHceReenable/SkipLinkStartup set, so EDK2's UfsPassThruDxe can send fDeviceInit (UfsPassThru.c:767 UfsSetFlag(UfsFlagDevInit), then UfsReadFlag; PcdUfsInitialCompletionTimeout 600000 us) without disturbing the ABL link. The adapter also records CBAR0 type S1_TRANS_S2_BYPASS and TTBR0 = 0, so UFS DMA uses physical addresses and no HALIOMMU domain is needed. Integrated as instantnoodlepPkg/Drivers/QcomUfsDxe plus MdeModulePkg UfsPassThruDxe, ScsiBusDxe and ScsiDiskDxe in the DSC [Components] and DXE.inc, with UefiScsiLib|MdePkg/Library/UefiScsiLib/UefiScsiLib.inf mapped; the vendor UFSDxe stays out (GenFfs log confirms it is not in the FV). Image builds/2026-10-29/boot-ossufs36.img (image daef53c60fec..., FD 4d65b9dd9a22..., kernel 732315ab..., probe 36), not yet hardware-tested.",
]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = [
  "The SEC entry-argument HOB patch is local to the WSL Mu-Silicium checkout; the Windows copy is unpatched.",
  "Hardware verification of the vendor-tree image is pending.",
  "UFSDxe/TzDxe are not in the image; the prior UFSDxe attempt failed with DEVICE_ERROR because its TZ application needs the tz partition. Enabling both switches may require making that failure non-fatal or reusing the kebab firmware configuration.",
  "The QR exporter is a menu plugin: every UFSDxe build fails before the menu, so the log cannot be opened. The control booted, so the logger is sound. The vendor UFSDxe/TZ path is closed on this firmware; the 8 Pro Mu-Silicium TZ/UFS handoff is the gap. The kebab 8T branch experiment/kebab-xnu-ramdisk is not on Project-Silicium's public origin and the kebab repo has no Binaries/kebab, so its working UFSDxe/TZ binaries are unavailable here. The USB CDC serial console is a separate kernel-side port and would not run before the kernel either.",
]
next_action = [
  "User resumed with their own approach (2026-10-29); the tree was restored to the stock baseline first: vendor UFSDxe back to 38d0db94... (UFSDxe.efi.orig kept), default PcdDebugPrintErrorLevel, original APRIORI order (UFSDxe before TzDxe). Baseline image boot-ufsdxe-stock15.img (image 2d1818b6..., FD c741bbd2...). The diagnostic knowledge and tooling stay: full RE report ufsdxe-full-re.md, analyzer tools/ufsd-re-analyze.py, the sense-key/ASC/ASCQ readouts (key 2 NOT READY, ASC 0x04, ASCQ unknown), the exc-handler SerialPortWrite tail + FAULT line, and all one-instruction patch scripts under tools/.",
  "Parallel RE fork (2026-10-29): Mu-Silicium-re (branch re-ufsdxe, fork point d4d1e3c), device repo UniXNU-instantnoodlep-re and out root unixnu-out-re are copies of the main trees; the fork carries the RE diagnostic patch on the vendor UFSDxe (0xdce4 logs (ASCQ<<8)|0xF instead of 0x28b, tool tools/patch-ufsdxe-ascq.py). The fork also tracks the vendor binaries in git (the Binaries gitlink pointed at a never-cloned submodule; replaced at f09d6ba with the stock UFSDxe, ASCQ probe at c52697b), so rolling the fork back to stock is just git reset --hard f09d6ba and new RE patches are ordinary commits. Its first image boot-ufsdxe-re-ascq15.img (image d4c32843..., FD 2b9f4c49...) is the flashing artifact of the fork; build it with unixnu build firmware / bootimg --device .../UniXNU-instantnoodlep-re --uefi .../Mu-Silicium-re --out .../unixnu-out-re. The main trees stay on the stock baseline for the user approach.",
  "ASCQ readout on hardware (boot-ufsdxe-ascq15.img): 20F = ASCQ 0x02 initializing-command-required - after every link reset the device waits for fDeviceInit (Query UPIU SET FLAG, opcode 6, flag IDN 1 per the kernel ufs.h). The RE fork answered with boot-ufsdxe-re-nocold15.img (image 7db95131..., FD 79277b37..., UFSDxe 719f6621..., re-ufsdxe commit ec776e0): UfsHwInit is stripped of every link-disturbing step (HCE=0 store, CFG1 rewrite, PCS/PHY pokes 0x16c8c/0x1683c/0x16bbc, both register patch tables) so the XBL-established link and the ready device state survive into the vendor driver; the ASCQ probe stays at 0xdce4 for readout, and rollback to stock is git reset --hard f09d6ba.",
  "BETA line + kernel probes 26-36 (2026-10-29): the firmware ships no vendor storage or TZ stack (STORAGE=0/TRUSTZONE=0, UFSDxe commented out of APRIORI.inc/DXE.inc, SmmuBypassDxe removed after it hung the board in APRIORI), and every kernel reconstruction of the vendor sequence has now been measured on hardware. Results: (a) with the firmware touching neither UFS nor SMMU the takeover still completes and the UTRLDBR store never retires (boot-beta-min15, row 1 = 3, row 2 = 1); (b) taking over the bootloader list is impossible because that heap was recycled by our own UEFI (dw0 = 0x7bfb); (c) stopping HCE without the full cold path leaves the whole register block reading zero (levels 27-29, 33, 35, 36); (d) the full coldStart plus DME_LINK_STARTUP gives cold 0 / link 0 / HCS.DP 1 and the doorbell still does not retire (levels 30-32, 34); (e) CFG1 bit 26, the vendor literal CFG1, the PCS and ICE-side pokes, UTMRLBA on the same page, low-4GiB DMA, cache maintenance, an empty UTRD and an SMMU bypass of streams 0x4E0/0xE0 all changed nothing. The vendor UFSDxe itself works in the same firmware (TUR answers CHECK CONDITION) and fails only on the device reply: sense key 2 / ASC 0x04 / ASCQ 0x02 = NOT READY, initializing command required. That state needs fDeviceInit (Query SET FLAG, opcode 6, IDN 1), which the vendor driver assumes XBL already sent. Next step is firmware-side: inject one Query SET FLAG into UFSDxe before its first TUR, using the working UTRL path and HALIOMMU domain. Full detail in NEXT-AGENT-HANDOFF.md and ufsdxe-full-re.md.",
  "Firmware-side ask to GFander (2026-10-29 late): kebab-UEFI is public now (38 patches, 9999-worktree.patch and src/, but only the kebabPkg diff), so the request is three specific questions instead: (1) whether his Binaries/kebab UFSDxe/TzDxe already carries a fDeviceInit query (Query SET FLAG, opcode 6, IDN 1); (2) what initialises the UFS host and link inside his firmware; (3) the exact HALIOMMU domain attach parameters. Never flash the 8T FD on the 8 Pro.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Firmware inputs, FD path and payload geometry for instantnoodlep" },
]

